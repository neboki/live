pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,ts,vue,json,md,yml,yaml,scss,css,html}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{js,ts,vue}'
      run: pnpm exec eslint {staged_files}
    stylelint:
      glob: '*.{scss,vue}'
      run: pnpm exec stylelint {staged_files}

commit-msg:
  commands:
    commitlint:
      # No path: commitlint finds the message itself, also in a worktree whose path has spaces
      run: pnpm exec commitlint --edit

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
