name: Android

# Builds the Android app in the cloud (no Android Studio needed locally) and keeps the
# debug APK as a download on the run's page. Run it by hand from the Actions tab, or let
# it run on pull requests that touch the app or the native project.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to full commit SHAs (the comment shows the version); Dependabot bumps them.
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Capacitor 8 builds with JDK 21; the runner already has the Android SDK
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:mobile
      - name: Debug APK
        working-directory: android
        # Windows checkouts lose the executable bit
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neboki-live-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
