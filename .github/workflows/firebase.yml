name: Deploy to Firebase Hosting

# The app's only host, in three channels:
# - pr-N: a temporary URL commented on each pull request from this repo
# - beta: main after CI passes, for checking merged work before users get it
# - live: only a version tag (v1.2.3 or stable-*), started by the Release workflow when
#   a release PR is merged (/publicar) or by hand to roll back (/volver)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to put on the live site (v1.2.3 or stable-*)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && 'live') || 'beta' }}
  cancel-in-progress: false

# Actions are pinned to full commit SHAs (the comment shows the version); Dependabot bumps them.
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      # The input goes through env, never interpolated into the script, to avoid injection
      - name: Check the version tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^(v[0-9]+\.[0-9]+\.[0-9]+|stable-[0-9A-Za-z.-]+)$'; then
            echo "::error::Only version tags (v1.2.3 or stable-*) go live, got: $TAG"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag)) || github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The app under /app/ and the landing page at the root
      - run: pnpm build:web
        env:
          # Firebase web app "Neboki Live": public by design (Auth and rules guard data)
          VITE_FIREBASE_API_KEY: AIzaSyAYXdL4M6zVEfGPnz3D_EJ4GfQLD6gzHPQ
          VITE_FIREBASE_AUTH_DOMAIN: neboki-live.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: neboki-live
          VITE_FIREBASE_APP_ID: 1:907698541743:web:6ebc7e43cebe6928d9305a
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEBOKI_LIVE }}
          projectId: neboki-live
          channelId: ${{ (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || (github.event_name == 'workflow_dispatch' && 'live') || 'beta' }}
          # Preview channels expire (live ignores this); each merge to main refreshes beta
          expires: ${{ github.event_name == 'workflow_run' && '30d' || '7d' }}
