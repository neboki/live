name: Deploy to Firebase Hosting

# The app's only host: live channel after CI passes on main, a preview
# channel (temporary URL commented on the PR) for pull requests from this repo.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-${{ github.event.pull_request.number || 'live' }}
  cancel-in-progress: false

# Actions are pinned to full commit SHAs (the comment shows the version); Dependabot bumps them.
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The app under /app/ and the landing page at the root
      - run: pnpm build:web
        env:
          # Firebase web app "Neboki Live": public by design (Auth and rules guard data)
          VITE_FIREBASE_API_KEY: AIzaSyAYXdL4M6zVEfGPnz3D_EJ4GfQLD6gzHPQ
          VITE_FIREBASE_AUTH_DOMAIN: neboki-live.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: neboki-live
          VITE_FIREBASE_APP_ID: 1:907698541743:web:6ebc7e43cebe6928d9305a
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEBOKI_LIVE }}
          projectId: neboki-live
          channelId: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'live' }}
